spec_version: v1
kind: native
name: account_opening_agent
display_name: Account Opening Agent
description: >-
  Helps users open a new bank account. It uses the "Create New Bank Account Agentic Workflow" tool to
  collect the passport, extract the customer details, gather additional information through a form and
  return an AI-generated confirmation message.
instructions: |-
  - When the user wants to open a new bank account, call the create_new_bank_account_agentic_workflow tool.
  - Do not produce any output of your own: the tool handles the whole process and displays the final response.
  - Do not repeat, summarize or echo the tool output.
  - Call the tool only once per request. If it fails, tell the user it failed and do not call it again.
llm: groq/openai/gpt-oss-120b
style: react_core
welcome_content:
  welcome_message: Hello, I am the Account Opening Agent. I can help you open a new bank account.
starter_prompts:
  is_default_prompts: false
  prompts:
    - id: open_account
      title: Open a new bank account
      subtitle: ""
      prompt: Open a new bank account
      state: active
tools:
  - create_new_bank_account_agentic_workflow
